<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mob-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="100%" stop-color="#0E131C" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="mob-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B26" />
      <stop offset="100%" stop-color="#0F141D" />
    </linearGradient>

    <!-- Poster 1: Dune / Desert Sci-Fi Art -->
    <linearGradient id="mob-p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Poster 2: Dark Knight / Noir City -->
    <linearGradient id="mob-p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Poster 3: Deep Space / Interstellar -->
    <linearGradient id="mob-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Poster 4: Cyberpunk / Action -->
    <linearGradient id="mob-p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="mob-shadow" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .mob-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mob-title { font-size: 19px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.3px; }
    .mob-input-txt { font-size: 13px; fill: #64748B; }
    .mob-cat-active { font-size: 13px; font-weight: 600; fill: #4F46E5; }
    .mob-cat-inactive { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .mob-filter-txt { font-size: 11px; font-weight: 500; fill: #94A3B8; }
    .mob-card-head { font-size: 13px; font-weight: 600; fill: #F8FAFC; }
    .mob-card-sub { font-size: 11px; fill: #64748B; }
    .mob-badge-txt { font-size: 9px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Mobile Canvas Background -->
  <rect width="390" height="844" fill="url(#mob-bg)" />

  <!-- ==================== HEADER (TITLE + HOME ICON) ==================== -->
  <g id="Mobile-Header" transform="translate(16, 44)">
    <!-- Home Icon -->
    <path d="M4 11L12 4L20 11V19C20 19.5 19.5 20 19 20H5C4.5 20 4 19.5 4 19V11Z" fill="#6366F1" />
    <path d="M9 20V12H15V20" fill="#080B10" />
    <text x="28" y="17" class="mob-sans mob-title">Home Media</text>
  </g>

  <!-- ==================== FULL-WIDTH SEARCH BAR ==================== -->
  <g id="FullWidth-Search" transform="translate(16, 78)">
    <rect width="358" height="42" rx="10" fill="#131924" stroke="#232C3D" stroke-width="1" />
    <!-- Magnifier Icon -->
    <circle cx="20" cy="21" r="5.5" stroke="#64748B" stroke-width="1.6" fill="none" />
    <line x1="24" y1="25" x2="29" y2="30" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" />
    <text x="36" y="26" class="mob-sans mob-input-txt">Search movies, series, music...</text>
  </g>

  <!-- ==================== HORIZONTAL CATEGORIES ==================== -->
  <g id="Category-Tabs" transform="translate(16, 134)">
    <!-- Movies (Active with underline indicator) -->
    <g transform="translate(0, 0)">
      <path d="M2 3H16V17H2V3Z" stroke="#818CF8" stroke-width="1.5" fill="none" rx="2" />
      <line x1="2" y1="7" x2="16" y2="7" stroke="#818CF8" stroke-width="1.2" />
      <text x="22" y="14" class="mob-sans mob-cat-active" fill="#818CF8">Movies</text>
      <rect x="0" y="24" width="70" height="2.5" rx="1.2" fill="#6366F1" />
    </g>

    <!-- Series -->
    <g transform="translate(86, 0)">
      <text x="0" y="14" class="mob-sans mob-cat-inactive">Series</text>
    </g>

    <!-- Music -->
    <g transform="translate(148, 0)">
      <text x="0" y="14" class="mob-sans mob-cat-inactive">Music</text>
    </g>

    <!-- Others -->
    <g transform="translate(206, 0)">
      <text x="0" y="14" class="mob-sans mob-cat-inactive">Others</text>
    </g>

    <!-- Expandable + Add Category -->
    <g transform="translate(268, 0)">
      <text x="0" y="14" class="mob-sans" font-size="12" fill="#6366F1" font-weight="600">+ Add</text>
    </g>
  </g>

  <!-- Thin Separator -->
  <line x1="16" y1="166" x2="374" y2="166" stroke="#1A2332" stroke-width="1" />

  <!-- ==================== LEAN FILTER BAR ==================== -->
  <g id="Filter-Bar" transform="translate(16, 178)">
    <!-- Sort By Button -->
    <g transform="translate(0, 0)">
      <rect width="138" height="28" rx="6" fill="#131924" stroke="#202A3B" stroke-width="1" />
      <text x="10" y="18" class="mob-sans mob-filter-txt">Sort: <tspan fill="#F1F5F9" font-weight="600">Recently Added</tspan></text>
      <path d="M124 13L128 17L132 13" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Year Filter -->
    <g transform="translate(146, 0)">
      <rect width="90" height="28" rx="6" fill="#131924" stroke="#202A3B" stroke-width="1" />
      <text x="10" y="18" class="mob-sans mob-filter-txt">Year: <tspan fill="#F1F5F9" font-weight="600">All</tspan></text>
      <path d="M74 13L78 17L82 13" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Quality Tag Filter -->
    <g transform="translate(244, 0)">
      <rect width="76" height="28" rx="6" fill="#131924" stroke="#202A3B" stroke-width="1" />
      <text x="10" y="18" class="mob-sans mob-filter-txt">4K / HDR</text>
      <path d="M62 13L66 17L70 13" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- ==================== 2-COLUMN MEDIA GRID ==================== -->
  <g id="Two-Column-Grid" transform="translate(16, 220)">

    <!-- ROW 1, COL 1: Desert Sci-Fi (Dune style) -->
    <g id="Mob-Card-1" transform="translate(0, 0)" filter="url(#mob-shadow)">
      <rect width="172" height="285" rx="10" fill="url(#mob-card-bg)" stroke="#1F2838" stroke-width="1" />
      <!-- Poster Artwork -->
      <rect x="1" y="1" width="170" height="210" rx="9" fill="url(#mob-p1)" />
      <!-- Giant Worm / Ring Motif -->
      <circle cx="85" cy="85" r="42" stroke="#FEF3C7" stroke-width="3" opacity="0.3" fill="none" />
      <circle cx="85" cy="85" r="22" stroke="#F59E0B" stroke-width="4" opacity="0.5" fill="none" />
      <!-- Lone Silhouette -->
      <rect x="83" y="130" width="4" height="14" rx="2" fill="#111827" />

      <!-- Duration Stamp (Bottom Right of poster) -->
      <rect x="116" y="186" width="48" height="18" rx="4" fill="#000000" fill-opacity="0.75" />
      <text x="123" y="199" class="mob-sans" font-size="10" fill="#FFFFFF" font-weight="600">2:46:12</text>

      <!-- Card Title & Metadata -->
      <text x="10" y="235" class="mob-sans mob-card-head">Dune: Part Two</text>
      <text x="10" y="252" class="mob-sans mob-card-sub">2024</text>
      <!-- Badges -->
      <rect x="10" y="259" width="22" height="15" rx="3" fill="#3B82F6" />
      <text x="14" y="270" class="mob-sans mob-badge-txt">4K</text>
      <rect x="36" y="259" width="28" height="15" rx="3" fill="#1E293B" />
      <text x="40" y="270" class="mob-sans mob-badge-txt" fill="#94A3B8">HDR</text>
    </g>

    <!-- ROW 1, COL 2: Gotham Noir (Batman style) -->
    <g id="Mob-Card-2" transform="translate(186, 0)" filter="url(#mob-shadow)">
      <rect width="172" height="285" rx="10" fill="url(#mob-card-bg)" stroke="#1F2838" stroke-width="1" />
      <rect x="1" y="1" width="170" height="210" rx="9" fill="url(#mob-p2)" />
      <!-- City Silhouettes & Rain streaks -->
      <rect x="30" y="50" width="20" height="90" fill="#0B0F17" opacity="0.7" />
      <rect x="60" y="30" width="30" height="110" fill="#090D14" opacity="0.9" />
      <polygon points="120,40 100,140 140,140" fill="#1E293B" opacity="0.4" />
      
      <!-- Duration Stamp -->
      <rect x="116" y="186" width="48" height="18" rx="4" fill="#000000" fill-opacity="0.75" />
      <text x="123" y="199" class="mob-sans" font-size="10" fill="#FFFFFF" font-weight="600">2:56:11</text>

      <!-- Card Metadata -->
      <text x="10" y="235" class="mob-sans mob-card-head">The Batman</text>
      <text x="10" y="252" class="mob-sans mob-card-sub">2022</text>
      <rect x="10" y="259" width="22" height="15" rx="3" fill="#3B82F6" />
      <text x="14" y="270" class="mob-sans mob-badge-txt">4K</text>
      <rect x="36" y="259" width="28" height="15" rx="3" fill="#1E293B" />
      <text x="40" y="270" class="mob-sans mob-badge-txt" fill="#94A3B8">HDR</text>
    </g>

    <!-- ROW 2, COL 1: Space Odyssey (Interstellar style) -->
    <g id="Mob-Card-3" transform="translate(0, 301)" filter="url(#mob-shadow)">
      <rect width="172" height="285" rx="10" fill="url(#mob-card-bg)" stroke="#1F2838" stroke-width="1" />
      <rect x="1" y="1" width="170" height="210" rx="9" fill="url(#mob-p3)" />
      <!-- Planet Curve & Starlight -->
      <circle cx="140" cy="50" r="60" fill="#38BDF8" opacity="0.35" />
      <circle cx="50" cy="70" r="1.5" fill="#FFFFFF" />
      <circle cx="100" cy="110" r="1.2" fill="#FFFFFF" />
      <circle cx="30" cy="130" r="1.8" fill="#FFFFFF" opacity="0.8" />

      <!-- Duration Stamp -->
      <rect x="116" y="186" width="48" height="18" rx="4" fill="#000000" fill-opacity="0.75" />
      <text x="123" y="199" class="mob-sans" font-size="10" fill="#FFFFFF" font-weight="600">2:49:04</text>

      <!-- Card Metadata -->
      <text x="10" y="235" class="mob-sans mob-card-head">Interstellar</text>
      <text x="10" y="252" class="mob-sans mob-card-sub">2014</text>
      <rect x="10" y="259" width="22" height="15" rx="3" fill="#3B82F6" />
      <text x="14" y="270" class="mob-sans mob-badge-txt">4K</text>
      <rect x="36" y="259" width="28" height="15" rx="3" fill="#1E293B" />
      <text x="40" y="270" class="mob-sans mob-badge-txt" fill="#94A3B8">HDR</text>
    </g>

    <!-- ROW 2, COL 2: Action / Neon (John Wick style) -->
    <g id="Mob-Card-4" transform="translate(186, 301)" filter="url(#mob-shadow)">
      <rect width="172" height="285" rx="10" fill="url(#mob-card-bg)" stroke="#1F2838" stroke-width="1" />
      <rect x="1" y="1" width="170" height="210" rx="9" fill="url(#mob-p4)" />
      <!-- Neon Bokeh Circles -->
      <circle cx="70" cy="70" r="30" fill="#F43F5E" opacity="0.4" />
      <circle cx="110" cy="110" r="25" fill="#FB923C" opacity="0.3" />
      <circle cx="50" cy="120" r="18" fill="#FBBF24" opacity="0.25" />

      <!-- Duration Stamp -->
      <rect x="116" y="186" width="48" height="18" rx="4" fill="#000000" fill-opacity="0.75" />
      <text x="123" y="199" class="mob-sans" font-size="10" fill="#FFFFFF" font-weight="600">2:49:13</text>

      <!-- Card Metadata -->
      <text x="10" y="235" class="mob-sans mob-card-head">John Wick: Ch. 4</text>
      <text x="10" y="252" class="mob-sans mob-card-sub">2023</text>
      <rect x="10" y="259" width="22" height="15" rx="3" fill="#3B82F6" />
      <text x="14" y="270" class="mob-sans mob-badge-txt">4K</text>
      <rect x="36" y="259" width="28" height="15" rx="3" fill="#1E293B" />
      <text x="40" y="270" class="mob-sans mob-badge-txt" fill="#94A3B8">HDR</text>
    </g>

  </g>
</svg>