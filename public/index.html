<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeMedia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen text-slate-100" style="background: radial-gradient(1200px 800px at 50% 0%, #121721, #0B0E14 60%);">
  <header class="mx-auto max-w-[1440px] px-4 pt-6 pb-5 sm:px-8 sm:pt-9 sm:pb-6">
    <div class="flex flex-col items-stretch justify-between gap-4 sm:flex-row sm:items-center sm:gap-6">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 grid place-items-center shadow-[0_8px_24px_-8px_rgba(99,102,241,0.9)]">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="white" aria-hidden="true">
            <path d="M5 3.5L12 8L5 12.5V3.5Z" />
          </svg>
        </div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-semibold tracking-tight">HomeMedia</h1>
          <span class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded-md bg-slate-800/80 border border-slate-700 text-indigo-200">LOCAL</span>
        </div>
      </div>
      <div class="relative w-full max-w-md sm:ml-auto">
        <div class="flex items-center gap-2 rounded-xl bg-[#161B26]/90 border border-slate-700/80 px-3 py-2 shadow-inner">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" class="text-slate-400" aria-hidden="true">
            <circle cx="7" cy="7" r="4.2" />
            <line x1="10.2" y1="10.2" x2="13.8" y2="13.8" stroke-linecap="round" />
          </svg>
          <input id="search-input" type="search" placeholder="Search titles..." class="flex-1 bg-transparent text-sm placeholder:text-slate-500 focus:outline-none" autocomplete="off" spellcheck="false">
          <span class="hidden sm:inline-flex px-1.5 py-0.5 text-[10px] font-semibold rounded-md bg-slate-800/80 border border-slate-700 text-slate-400">⌘ K</span>
        </div>
      </div>
    </div>
    <div class="mt-6 h-px w-full bg-gradient-to-r from-transparent via-slate-700/60 to-transparent"></div>
  </header>

  <main class="mx-auto max-w-[1440px] px-4 pb-8 sm:px-8 sm:pb-10">
    <section id="list-view" class="space-y-6">
      <nav aria-label="Video categories" class="-mx-1 flex items-center gap-2 overflow-x-auto px-1 pb-1">
        <button data-category="All" class="category-tab active shrink-0 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-[0_8px_30px_-12px_rgba(99,102,241,1)] transition">All</button>
        <button data-category="Movies" class="category-tab shrink-0 rounded-lg border border-[#262F40] bg-[#161B26] px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800/80">Movies</button>
        <button data-category="Series" class="category-tab shrink-0 rounded-lg border border-[#262F40] bg-[#161B26] px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800/80">Series</button>
        <button data-category="Music" class="category-tab shrink-0 rounded-lg border border-[#262F40] bg-[#161B26] px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800/80">Music</button>
        <button data-category="Other" class="category-tab shrink-0 rounded-lg border border-[#262F40] bg-[#161B26] px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800/80">Others</button>
      </nav>

      <div id="video-grid" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5"></div>
      <p id="empty" class="text-slate-400 hidden">No videos found.</p>
    </section>

    <section id="player-view" class="hidden px-0 sm:px-2">
      <button id="back-btn" class="mb-4 inline-flex items-center gap-1.5 text-slate-400 hover:text-slate-100 transition text-sm">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 4L6 8L10 12" />
        </svg>
        Back
      </button>
      <h2 id="player-title" class="text-lg mb-4 font-medium"></h2>
      <video id="player" controls class="w-full rounded-2xl bg-black aspect-video shadow-[0_40px_60px_-40px_rgba(15,23,42,0.9)]"></video>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
