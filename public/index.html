<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeMedia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen bg-[#101112] text-[#F4F0E9]">
  <header class="border-b border-[#303234]">
    <div class="mx-auto flex max-w-[1440px] flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:gap-6 sm:px-8 sm:py-5">
      <a href="/" class="flex items-center gap-3">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#E9B477]">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="#101112" aria-hidden="true">
            <path d="M5 3.5L12 8L5 12.5V3.5Z" />
          </svg>
        </span>
        <span class="flex items-center gap-2">
          <span class="text-lg font-semibold tracking-tight">HomeMedia</span>
          <span class="rounded-md border border-[#303234] bg-[#191B1D] px-1.5 py-0.5 text-[10px] font-bold text-[#A2A3A3]">LOCAL</span>
        </span>
      </a>
      <nav aria-label="Sections" class="flex items-center gap-4 text-sm">
        <span aria-current="page" class="font-medium text-[#E9B477]">Library</span>
        <span class="cursor-not-allowed text-[#6E7376]" title="Coming soon" aria-disabled="true">Collections</span>
      </nav>
      <div class="relative w-full max-w-md sm:ml-auto">
        <label class="sr-only" for="search-input">Search titles</label>
        <div class="flex items-center gap-2 rounded-xl border border-[#303234] bg-[#191B1D] px-3 py-2 transition focus-within:border-[#E9B477]">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" class="shrink-0 text-[#6E7376]" aria-hidden="true">
            <circle cx="7" cy="7" r="4.2" />
            <line x1="10.2" y1="10.2" x2="13.8" y2="13.8" stroke-linecap="round" />
          </svg>
          <input id="search-input" type="search" placeholder="Search your library..." class="min-w-0 flex-1 bg-transparent text-sm placeholder:text-[#6E7376] focus:outline-none" autocomplete="off" spellcheck="false">
          <span class="hidden rounded-md border border-[#303234] bg-[#101112] px-1.5 py-0.5 text-[10px] font-semibold text-[#6E7376] sm:inline-flex">⌘ K</span>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-4 pb-10 sm:px-8">
    <section id="list-view" class="space-y-6 pt-6">
      <nav aria-label="Video categories" class="flex items-center gap-2 overflow-x-auto pb-1">
        <button type="button" data-category="All" class="category-tab active">All</button>
        <button type="button" data-category="Movies" class="category-tab">Movies</button>
        <button type="button" data-category="Series" class="category-tab">Series</button>
        <button type="button" data-category="Music" class="category-tab">Music</button>
        <button type="button" data-category="Other" class="category-tab">Others</button>
      </nav>

      <div id="loading" class="flex items-center gap-3 py-16 text-sm text-[#A2A3A3]">
        <span class="h-4 w-4 animate-spin rounded-full border-2 border-[#303234] border-t-[#E9B477]" aria-hidden="true"></span>
        Loading your library…
      </div>

      <div id="error" class="hidden rounded-xl border border-[#303234] bg-[#191B1D] p-6 text-sm text-[#A2A3A3]">
        Could not load your library. Check that the server is running, then reload.
      </div>

      <div id="video-grid" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5"></div>
      <p id="empty" class="hidden py-16 text-sm text-[#A2A3A3]">No videos match this view.</p>
    </section>

    <section id="player-view" class="hidden pt-6">
      <button id="back-btn" type="button" class="mb-4 inline-flex items-center gap-1.5 text-sm text-[#A2A3A3] transition hover:text-[#F4F0E9]">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 4L6 8L10 12" />
        </svg>
        Back
      </button>
      <h2 id="player-title" class="mb-4 text-lg font-medium"></h2>
      <video id="player" controls class="aspect-video w-full rounded-2xl border border-[#303234] bg-black"></video>
    </section>
  </main>

  <footer class="border-t border-[#303234]">
    <div class="mx-auto flex max-w-[1440px] flex-col gap-3 px-4 py-6 sm:flex-row sm:items-center sm:justify-between sm:px-8">
      <p class="text-sm text-[#A2A3A3]">HomeMedia — your library, streamed across the LAN.</p>
      <div class="flex items-center gap-4 text-sm">
        <button type="button" class="text-[#A2A3A3] transition hover:text-[#E9B477]">Keyboard shortcuts</button>
        <span aria-hidden="true" class="text-[#303234]">·</span>
        <button type="button" class="text-[#A2A3A3] transition hover:text-[#E9B477]">Library settings</button>
      </div>
    </div>
    <p class="mx-auto max-w-[1440px] px-4 pb-6 text-xs text-[#6E7376] sm:px-8">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
